<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1CE — Espace de classe</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{font-family:system-ui,sans-serif;color:#eaf1ff;background:#0b1220}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1220,#15233a);min-height:100vh}main{max-width:1050px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:#9ce7c8;color:#102033;font-weight:900}.muted{color:#aebbd0;font-size:13px}.panel{background:#142238;border:1px solid #2b3d58;border-radius:20px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.full{grid-column:1/-1}h1,h2{margin:0 0 8px}h1{font-size:24px}h2{font-size:20px}.field{width:100%;padding:12px;margin:7px 0;border:1px solid #3a4d69;border-radius:10px;background:#0c1728;color:#fff}.button{padding:11px 15px;border:0;border-radius:10px;background:#9ce7c8;color:#102033;font-weight:800;cursor:pointer}.secondary{background:transparent;color:#dce7f5;border:1px solid #3a4d69}.row{display:flex;gap:9px;flex-wrap:wrap}.item{padding:14px 0;border-top:1px solid #2b3d58}.content{white-space:pre-wrap;line-height:1.55}.status{min-height:20px;margin-top:10px;color:#f6cc75;font-size:13px}.hidden{display:none!important}.photo{width:100%;max-height:280px;object-fit:cover;border-radius:12px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header class="top"><div class="brand"><div class="logo">1CE</div><div><h1>Espace de classe</h1><div class="muted">1ère secondaire · contenus réels de la classe</div></div></div><button id="logout" class="button secondary hidden">Se déconnecter</button></header><section id="auth" class="panel"><h2>Connexion</h2><p class="muted">Connecte-toi avec ton compte de classe.</p><input id="email" class="field" type="email" placeholder="Adresse e-mail"><input id="password" class="field" type="password" placeholder="Mot de passe"><div class="row"><button id="login" class="button">Se connecter</button><button id="signup" class="button secondary">Créer un compte</button></div><div id="authStatus" class="status"></div></section><section id="app" class="hidden"><div class="grid"><article class="panel"><h2>Fil de la classe</h2><form id="postForm"><textarea id="postContent" class="field" rows="3" maxlength="3000" placeholder="Partager une information réelle…"></textarea><button class="button">Publier</button></form><div id="postStatus" class="status"></div><div id="posts"></div></article><article class="panel"><h2>Salon 1CE</h2><form id="messageForm"><input id="messageContent" class="field" maxlength="1000" placeholder="Écrire un message…"><button class="button">Envoyer</button></form><div id="messageStatus" class="status"></div><div id="messages"></div></article><article class="panel full"><h2>Photos de la classe</h2><div id="photos"></div></article></div></section></main><script>
const db=supabase.createClient('https://fbqxuqkbywqvvynektqb.supabase.co','sb_publishable_VC3uEiNgvTX_2-L4DcKmVw_LwAVJuB8');let session=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=s=>new Date(s).toLocaleString('fr-BE',{dateStyle:'short',timeStyle:'short'});const msg=(id,t)=>$(id).textContent=t||'';
async function credentials(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg('authStatus','Remplis ton e-mail et ton mot de passe.');return null}return{email,password}}$('login').onclick=async()=>{const a=await credentials();if(a){const{error}=await db.auth.signInWithPassword(a);msg('authStatus',error?.message)}};$('signup').onclick=async()=>{const a=await credentials();if(a){const{error}=await db.auth.signUp(a);msg('authStatus',error?.message||'Compte créé. Vérifie ton e-mail si nécessaire.')}};$('logout').onclick=()=>db.auth.signOut();
async function loadPosts(){const{data,error}=await db.from('posts').select('content,author_name,created_at').order('created_at',{ascending:false}).limit(30);$('posts').innerHTML=error?'<p class="muted">Impossible de charger les publications.</p>':(data||[]).map(p=>`<div class="item"><b>${esc(p.author_name||'Membre')}</b> <span class="muted">· ${date(p.created_at)}</span><div class="content">${esc(p.content)}</div></div>`).join('')||'<p class="muted">Aucune publication.</p>'}async function loadMessages(){const{data,error}=await db.from('messages').select('content,author_name,created_at').order('created_at',{ascending:false}).limit(40);$('messages').innerHTML=error?'<p class="muted">Impossible de charger les messages.</p>':(data||[]).map(m=>`<div class="item"><b>${esc(m.author_name||'Membre')}</b> <span class="muted">· ${date(m.created_at)}</span><div class="content">${esc(m.content)}</div></div>`).join('')||'<p class="muted">Aucun message.</p>'}async function loadPhotos(){const{data,error}=await db.from('photos').select('object_path,caption,created_at').order('created_at',{ascending:false}).limit(24);if(error){$('photos').innerHTML='<p class="muted">Impossible de charger les photos.</p>';return}const a=[];for(const p of data||[]){const{data:u}=await db.storage.from('class-photos').createSignedUrl(p.object_path,3600);a.push(`<div class="item"><b>${esc(p.caption||'Photo de la classe')}</b> <span class="muted">· ${date(p.created_at)}</span>${u?.signedUrl?`<img class="photo" src="${u.signedUrl}" alt="Photo 1CE">`:''}</div>`)}$('photos').innerHTML=a.join('')||'<p class="muted">Aucune photo.</p>'}
$('postForm').onsubmit=async e=>{e.preventDefault();const content=$('postContent').value.trim();if(!content)return;const{error}=await db.from('posts').insert({author_id:session.user.id,content});msg('postStatus',error?.message||'Publication enregistrée.');if(!error){$('postContent').value='';loadPosts()}};$('messageForm').onsubmit=async e=>{e.preventDefault();const content=$('messageContent').value.trim();if(!content)return;const{error}=await db.from('messages').insert({author_id:session.user.id,content});msg('messageStatus',error?.message||'Message envoyé.');if(!error){$('messageContent').value='';loadMessages()}};async function render(s){session=s;$('auth').classList.toggle('hidden',!!s);$('app').classList.toggle('hidden',!s);$('logout').classList.toggle('hidden',!s);if(s)await Promise.all([loadPosts(),loadMessages(),loadPhotos()])}db.auth.getSession().then(({data})=>render(data.session));db.auth.onAuthStateChange((_,s)=>render(s));
</script></body></html>
